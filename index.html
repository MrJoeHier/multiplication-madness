<style>
:root, [data-theme="notebook"] {
  --app-bg:#e8e5de; --paper:#fffef9; --rule:#c9dcee; --margin:#eba9a9; --ink:#363b43; --ink-soft:#8b919b;
  --accent:#3a72d8; --accent-soft:rgba(58,114,216,.13); --carry:#c4621c; --good:#2f9a5a; --bad:#d24848; --warn:#d99a1e;
  --panel:#f2f0eb; --key:#ffffff; --key-ink:#2b2f36; --key-edge:#d3cec4; --key-off:#ece9e3; --header:#faf9f6;
  --slot:#7d8796; --side-bg:rgba(58,114,216,.05); --side-edge:rgba(58,114,216,.28); --overlay:rgba(40,42,48,.45); --card:#ffffff;
}
[data-theme="slate"] {
  --app-bg:#1d2025; --paper:#2a2e35; --rule:#394049; --margin:#62414a; --ink:#e9ebee; --ink-soft:#9aa2ad;
  --accent:#7fb0ff; --accent-soft:rgba(127,176,255,.16); --carry:#f2a65f; --good:#62d394; --bad:#ff7a7a; --warn:#f3c55b;
  --panel:#23272d; --key:#353a42; --key-ink:#eef0f3; --key-edge:#14171b; --key-off:#2b2f36; --header:#23272d;
  --slot:#a8b0bb; --side-bg:rgba(127,176,255,.06); --side-edge:rgba(127,176,255,.3); --overlay:rgba(0,0,0,.55); --card:#2f343c;
}
[data-theme="sand"] {
  --app-bg:#e6ddcc; --paper:#f9f3e5; --rule:#ddd0b5; --margin:#d8a28d; --ink:#4a4136; --ink-soft:#958a7a;
  --accent:#2f7f7a; --accent-soft:rgba(47,127,122,.14); --carry:#b5562a; --good:#3c8a4f; --bad:#c2453a; --warn:#c48a1c;
  --panel:#efe7d8; --key:#fffaf0; --key-ink:#3d352c; --key-edge:#cfc2a8; --key-off:#e9e0cf; --header:#f6f0e3;
  --slot:#8f8371; --side-bg:rgba(47,127,122,.06); --side-edge:rgba(47,127,122,.3); --overlay:rgba(60,50,35,.45); --card:#fffaf0;
}
* { box-sizing:border-box; }
html, body { height:100%; margin:0; overscroll-behavior:none; background:var(--app-bg); }
body { touch-action:manipulation; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;
  font-family: -apple-system, "Segoe UI", system-ui, sans-serif; color:var(--ink); overflow:hidden; }
button { font:inherit; color:inherit; touch-action:manipulation; -webkit-tap-highlight-color:transparent; cursor:pointer; }
#app { display:flex; flex-direction:column; height:100vh; height:100dvh; max-height:100svh; box-sizing:border-box; padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right); overflow:hidden; }
@supports (height: 100svh) {
  html, body { height:100svh; max-height:100dvh; }
  #app { height:100svh; max-height:100dvh; }
}
/* Boot cover: hide the math board from first paint until the start screen is up */
html.booting, html.booting body { background:#0b0805; }
html.booting #app, html.booting #overlay-root { visibility:hidden; }
#bootcover { position:fixed; inset:0; z-index:10000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:#0b0805; }
#bootcover .spin { width:54px; height:54px; border-radius:50%; border:4px solid rgba(255,255,255,.25); border-top-color:#f3c65a; animation:vspin .8s linear infinite; }
#bootcover.go { opacity:0; transition:opacity .28s ease; pointer-events:none; }
@media (prefers-reduced-motion: reduce) {
  #bootcover .spin { animation:none; }
  #bootcover.go { transition:none; }
}

/* ---------- header ---------- */
header { flex:0 0 auto; display:flex; align-items:center; gap:12px; padding:8px 14px; padding-top:calc(8px + env(safe-area-inset-top));
  background:var(--header); border-bottom:1px solid var(--key-edge); min-height:56px; }
.brand { font-weight:800; font-size:1.1rem; letter-spacing:.01em; white-space:nowrap; }
.brand small { font-weight:600; color:var(--ink-soft); font-size:.75rem; margin-left:4px; }
.chips { display:flex; gap:6px; align-items:center; margin-left:auto; flex-wrap:wrap; justify-content:flex-end; }
.chip { background:var(--panel); border:1px solid var(--key-edge); border-radius:999px; padding:6px 9px; font-weight:700; font-size:.9rem; white-space:nowrap; }
.chip .lbl { color:var(--ink-soft); font-weight:600; margin-right:4px; }
.hearts { letter-spacing:2px; font-size:1.05rem; }
.heart { color:var(--bad); display:inline-block; transition:transform .2s; }
.heart.lost { color:var(--key-edge); }
.heart.pop { animation:heartPop .55s ease; }
@keyframes heartPop { 0%{transform:scale(1)} 30%{transform:scale(1.6) rotate(-12deg)} 100%{transform:scale(1)} }
.meter { display:flex; align-items:center; gap:5px; }
.meterbar { position:relative; width:clamp(76px, 12vw, 150px); height:14px; border-radius:999px; background:var(--key-off); border:1px solid var(--key-edge); overflow:hidden; }
.fillbar { position:absolute; left:0; top:0; bottom:0; width:100%; border-radius:999px; background:var(--good); transition:width .9s cubic-bezier(.2,.9,.3,1), background .4s; }
.fillbar::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); transform:translateX(-100%); }
.fillbar.charging::after, .meter.charge .fillbar::after { animation:shine .9s ease-out 2; }
@keyframes shine { to { transform:translateX(100%); } }
.meter .pct { min-width:3.2em; text-align:right; font-variant-numeric:tabular-nums; }
.meter.drain { animation:shake .38s ease; }
.meter.drain .meterbar { box-shadow:0 0 0 3px rgba(210,72,72,.35); }
.meter.charge .meterbar { box-shadow:0 0 0 4px rgba(47,154,90,.35); transition:box-shadow .3s; }
.refill { display:flex; flex-direction:column; align-items:center; gap:6px; margin:10px 0 6px; }
.refill .rlbl { font-weight:800; color:var(--good); }
.refill .meterbar { width:min(320px, 80%); height:22px; }
.refill .pct { font-weight:900; font-size:1.4rem; font-variant-numeric:tabular-nums; }
.cell.qtarget { cursor:pointer; }
.cell.qtarget::after { content:''; position:absolute; left:8%; right:8%; top:6%; bottom:4%; border:2.5px dashed var(--accent); border-radius:10px; background:var(--accent-soft); opacity:.75; }
.cell.qtarget::before { content:''; position:absolute; inset:calc(var(--rh) * -.35) -3px -2px; } /* bigger touch area (upwards into the margin) */
.cell.qtarget.hinting::after { animation:nudge .9s ease-in-out infinite; opacity:1; }
.cell.selq { background:var(--accent-soft); border-radius:8px; box-shadow:inset 0 0 0 2.5px var(--accent); animation:slotPulse 1.3s ease-in-out infinite; }
.timer .tv { font-variant-numeric:tabular-nums; font-size:1.05rem; font-weight:900; min-width:2.7em; display:inline-block; text-align:right; }
.timer.warn { background:#fff3d6; border-color:var(--warn); color:#8a5a00; }
.timer.danger { background:var(--bad); border-color:var(--bad); color:#fff; animation:tpulse 1s ease-in-out infinite; }
.timer.danger .lbl { color:#fff; }
.timer.paused { opacity:.6; }
@keyframes tpulse { 0%,100%{ transform:scale(1); box-shadow:0 0 0 0 rgba(210,72,72,.5);} 50%{ transform:scale(1.08); box-shadow:0 0 0 6px rgba(210,72,72,0);} }
.epseg { margin:6px 0 2px; }
.epbadge { font-size:3.2rem; line-height:1; animation:starIn .6s cubic-bezier(.3,1.7,.5,1); }
.epnext { color:var(--ink) !important; }
.icon-btn { width:44px; height:44px; border-radius:12px; border:1px solid var(--key-edge); background:var(--key); font-size:1.3rem; display:grid; place-items:center; }

/* ---------- paper workspace ---------- */
#work { flex:1 1 auto; min-height:0; position:relative; overflow:auto; -webkit-overflow-scrolling:touch; background:var(--paper); }
#prompt { position:sticky; top:0; left:0; z-index:5; padding:8px 14px; font-weight:700; font-size:1rem; color:var(--ink);
  background:linear-gradient(var(--paper) 70%, transparent); pointer-events:none; min-height:38px; }
#prompt.warnmsg { color:var(--carry); }
#prompt.badmsg { color:var(--bad); }
#board { position:absolute; left:0; top:0; }
.paperbg { position:absolute; left:0; top:0; pointer-events:none;
  background-image:
    linear-gradient(to right, transparent var(--mx), var(--margin) var(--mx), var(--margin) calc(var(--mx) + 2px), transparent calc(var(--mx) + 2px)),
    repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--rh) - 1px), var(--rule) calc(var(--rh) - 1px), var(--rule) var(--rh)); }
.hand { font-family: "Noteworthy", "Chalkboard SE", "Comic Neue", "Patrick Hand", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive; font-variant-numeric:tabular-nums; }
.cell { position:absolute; width:var(--cw); height:var(--rh); display:flex; align-items:flex-end; justify-content:center;
  font-size:calc(var(--rh) * .68); line-height:1; padding-bottom:calc(var(--rh) * .1); color:var(--ink); font-weight:600; }
.cell.divisor { color:var(--ink); }
.cell.quo { color:var(--accent); font-weight:700; }
.cell.cur { background:var(--accent-soft); }
.cell.tap { cursor:pointer; }
.cell.tap::before { content:''; position:absolute; inset:-6px -2px; } /* bigger hit area */
.cell.place-hint { border-radius:8px; }
.cell.placed { background:var(--accent-soft); border-radius:6px; }
.cell.slot::after { content:''; position:absolute; left:10%; right:10%; top:12%; bottom:6%; border:2.5px dashed var(--slot); border-radius:8px; animation:slotPulse 1.3s ease-in-out infinite; }
@keyframes slotPulse { 0%,100%{opacity:.55} 50%{opacity:1} }
.cell.prod { color:var(--ink); }
.cell.diff { color:var(--ink); }
.cell.brought { color:var(--ink); }
.cell.arrive { visibility:hidden; }
.cell.struck > .dg { position:relative; opacity:.55; }
.cell.struck > .dg::after { content:''; position:absolute; left:-18%; right:-18%; top:50%; height:2.5px; border-radius:2px; background:var(--carry); transform:rotate(-58deg); }
.cell.struck.fresh > .dg::after { animation:strike .32s ease-out; }
@keyframes strike { from{ transform:rotate(-58deg) scaleX(0);} to{ transform:rotate(-58deg) scaleX(1);} }
.mark { position:absolute; top:calc(var(--rh) * .02); right:calc(var(--cw) * -.2); font-size:.56em; background:var(--paper); border-radius:4px; padding:0 1px; color:var(--carry); font-weight:800; line-height:1; }
.mark.fresh { animation:markPop .38s cubic-bezier(.3,1.6,.5,1); }
@keyframes markPop { 0%{ transform:translateY(8px) scale(.2); opacity:0;} 100%{ transform:none; opacity:1;} }
.cell.nudge { animation:nudge .9s ease-in-out infinite; border-radius:8px; }
.cell.nudge::before { content:''; position:absolute; inset:2px; border-radius:10px; box-shadow:0 0 0 3px var(--warn); background:rgba(217,154,30,.12); }
@keyframes nudge { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-5px);} }
.cell.shake, .shake { animation:shake .38s ease; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)} 40%{transform:translateX(7px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(4px)} }
.cell.glow { animation:glow .6s ease; }
@keyframes glow { 0%{ text-shadow:0 0 0 transparent; transform:scale(1);} 40%{ text-shadow:0 0 14px var(--good); transform:scale(1.18);} 100%{ transform:scale(1);} }
.sign { position:absolute; font-family:-apple-system, "Segoe UI", system-ui, sans-serif; font-weight:500; font-size:calc(var(--rh) * .62); line-height:1; color:var(--ink); display:flex; align-items:flex-end; height:var(--rh); padding-bottom:calc(var(--rh)*.14); width:var(--cw); justify-content:center; }
.rule-line { position:absolute; height:2.5px; background:var(--ink); border-radius:2px; }
svg.bracket { position:absolute; left:0; top:0; pointer-events:none; overflow:visible; }
svg.bracket path { stroke:var(--ink); stroke-width:3; fill:none; stroke-linecap:round; }
.rlabel { color:var(--accent); font-weight:700; }

/* side multiply problem */
.side { position:absolute; border:2px dashed var(--side-edge); background:var(--side-bg); border-radius:14px; }
.side.fading { animation:fadeOut .7s ease forwards; }
@keyframes fadeOut { 0%{opacity:1} 60%{opacity:1} 100%{opacity:0; transform:scale(.96)} }
.side-in { animation:sideIn .28s ease-out; }
@keyframes sideIn { from{ opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
.cell.carryc { font-size:calc(var(--rh) * .36); color:var(--carry); font-weight:800; padding-bottom:0; align-items:center; height:calc(var(--rh) * .6); }
.cell.focus { color:var(--accent); }
.cell.focus::before { content:''; position:absolute; left:14%; right:14%; bottom:4%; height:3px; border-radius:3px; background:var(--accent); opacity:.6; }
.cell.sp-filled { color:var(--ink); }

/* compare box */
.cmp { position:absolute; display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 10px; border-radius:14px;
  background:var(--card); border:2px solid var(--accent); box-shadow:0 8px 24px rgba(0,0,0,.15); animation:sideIn .25s ease-out; z-index:4; }
.cmp .q { font-weight:800; font-size:1rem; white-space:nowrap; }
.cmp .row { display:flex; gap:10px; }
.cmp button { min-width:84px; min-height:52px; border-radius:12px; border:2px solid var(--key-edge); background:var(--key); font-size:1.15rem; font-weight:800; }
.cmp button.yes { border-color:var(--good); color:var(--good); }
.cmp button.no { border-color:var(--bad); color:var(--bad); }
.cmp button:active { transform:scale(.96); }

/* ---------- input area ---------- */
#input { flex:0 0 auto; background:var(--panel); border-top:1px solid var(--key-edge); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); }
#inner { display:grid; gap:10px; max-width:640px; margin:0 auto; grid-template-columns:1fr; grid-template-areas:"steps" "pad" "ctx"; }
.steps { grid-area:steps; display:grid; grid-template-columns:repeat(5, 1fr); gap:8px; }
.padwrap { grid-area:pad; display:flex; flex-direction:column; gap:8px; }
.cmpbar { display:flex; flex-direction:column; gap:6px; padding:8px; border-radius:16px; background:var(--card); border:2px solid var(--accent); box-shadow:0 6px 18px rgba(0,0,0,.12); }
.cmpbar[hidden] { display:none; }
.cmpbar.in { animation:sideIn .22s ease-out; }
.cmpbar .cq { text-align:center; font-weight:800; font-size:1.05rem; }
.cmpbar .crow { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.cbtn { min-height:max(64px, var(--kh, 58px)); border-radius:14px; border:2px solid var(--key-edge); background:var(--key); font-size:1.5rem; font-weight:900; box-shadow:0 3px 0 var(--key-edge); }
.cbtn.yes { border-color:var(--good); color:var(--good); }
.cbtn.no { border-color:var(--bad); color:var(--bad); }
.cbtn:active { transform:translateY(3px); box-shadow:none; }
.cell.cmpnum { color:var(--accent); font-weight:800; }
.cell.cmpnum::after { content:''; position:absolute; left:2%; right:2%; top:10%; bottom:4%; border-radius:8px; background:var(--accent-soft); box-shadow:inset 0 0 0 2px var(--accent); animation:slotPulse 1.3s ease-in-out infinite; }
.cell.cmpdiv { color:var(--accent); font-weight:800; }
.cell.cmpdiv::after { content:''; position:absolute; left:6%; right:6%; bottom:2%; height:3px; border-radius:3px; background:var(--accent); }
.pad { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
.pad .zero { grid-column:1 / span 3; }
.ctx { grid-area:ctx; display:flex; gap:8px; }
.ctx button { flex:1; }
.key, .step, .ctxb { min-height:var(--kh, 58px); border-radius:14px; border:1px solid var(--key-edge); background:var(--key); color:var(--key-ink);
  box-shadow:0 3px 0 var(--key-edge); font-weight:800; transition:transform .06s, box-shadow .06s, background .15s, opacity .15s; position:relative; }
.key { font-size:1.6rem; }
.step { font-size:2rem; line-height:1; }
.ctxb { font-size:1.05rem; }
.key:active:not(:disabled), .step:active:not(:disabled), .ctxb:active:not(:disabled), .pressed { transform:translateY(3px); box-shadow:0 0 0 var(--key-edge); }
.step.active { background:var(--accent); color:#fff; border-color:var(--accent); box-shadow:0 3px 0 rgba(0,0,0,.25); }
.step.okflash { animation:okflash .45s ease; }
@keyframes okflash { 0%{ box-shadow:0 0 0 0 var(--good);} 60%{ box-shadow:0 0 0 10px transparent;} }
button:disabled { opacity:.38; cursor:default; background:var(--key-off); box-shadow:none; }
.ctxb.cant { border-color:var(--carry); color:var(--carry); }
.ctxb.hidden { display:none; }
.wrongflash { background:var(--bad) !important; color:#fff !important; }

@media (orientation: landscape) and (min-width: 700px) {
  #inner { max-width:1000px; grid-template-columns: 1.25fr 1fr; grid-template-areas:"steps pad" "ctx pad"; align-items:start; }
  .steps { align-self:stretch; }
  .step { min-height:calc(var(--kh, 54px) * 1.55); }
  #input { --kh: min(54px, 7.4vh); }
}
@media (orientation: landscape) and (min-width: 700px) and (max-height: 800px) {
  header { min-height:44px; padding:4px 12px; padding-top:calc(4px + env(safe-area-inset-top)); gap:8px; }
  #input { --kh: min(46px, 6.2vh); padding:6px 10px calc(6px + env(safe-area-inset-bottom)); }
  #inner { gap:6px; }
  .pad, .steps { gap:6px; }
  .step { min-height:calc(var(--kh, 46px) * 1.3); }
  [data-theme="journal"] #work { margin:4px 10px 4px; }
}
@media (orientation: portrait) { #input { --kh: min(60px, 6.2vh); } }

/* Sticky quotient + dividend so the problem being divided never scrolls away.
   Height 0 so it takes no flow space; the inner box paints downward over the board head. */
#pin { position:sticky; top:0; z-index:4; pointer-events:none; height:0; overflow:visible; flex:0 0 auto; }
#pin .pin-inner { position:relative; overflow:hidden; pointer-events:none; background:var(--paper); }
[data-theme="journal"] #pin .pin-inner { background:#f6eacc; }
[data-theme] body.ep-snow #pin .pin-inner { background:#fafdff; }

/* iPhone / narrow phones: one compact HUD row, smaller keypad, more room for the problem. */
@media (max-width: 600px) {
  header { min-height:36px; padding:2px 6px; padding-top:calc(2px + env(safe-area-inset-top)); gap:6px; }
  .brand small { display:none; }
  .brand { font-size:.8rem; }
  .chips { flex-wrap:nowrap; gap:4px; }
  .pie { width:34px; height:34px; }
  .pie::after { inset:7px; }
  .pie .tv { font-size:.58rem; }
  .chip { padding:2px 6px; font-size:.72rem; }
  .chip .lbl { display:none; }
  .meterbar { width:52px; height:10px; }
  .meter .pct { min-width:2.4em; font-size:.72rem; }
  .icon-btn { width:32px; height:32px; font-size:1rem; }
  #prompt { padding:4px 8px; font-size:.88rem; min-height:26px; }
  [data-theme="journal"] #prompt { font-size:.92rem; }
  [data-theme="journal"] #work { margin:4px 6px 3px; }
  #input { --kh: min(46px, 5.2vh); padding:6px 8px calc(6px + env(safe-area-inset-bottom)); }
  #inner { gap:6px; }
  .pad, .steps, .ctx { gap:6px; }
  .key { font-size:1.25rem; }
  .step { font-size:1.5rem; }
  .ctxb { font-size:.9rem; }
  .cbtn { min-height:max(48px, var(--kh, 46px)); font-size:1.2rem; }
}
@media (max-width: 400px) {
  .brand { display:none; }
}

/* iPhone landscape: problem on the left (~62% width, full remaining height),
   step buttons + keypad stacked in a column on the right so digits can stay large. */
@media (orientation: landscape) and (max-height: 520px) {
  #app {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(200px, 38%);
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "hud hud" "paper keys";
  }
  header {
    grid-area: hud;
    min-height:32px; padding:2px 8px; padding-top:calc(2px + env(safe-area-inset-top));
    gap:6px;
  }
  .brand small { display:none; }
  .brand { font-size:.78rem; }
  .chips { flex-wrap:nowrap; gap:4px; }
  .pie { width:30px; height:30px; }
  .pie::after { inset:6px; }
  .pie .tv { font-size:.55rem; }
  .chip { padding:2px 6px; font-size:.7rem; }
  .chip .lbl { display:none; }
  .meterbar { width:48px; height:10px; }
  .meter .pct { min-width:2.4em; font-size:.7rem; }
  .icon-btn { width:30px; height:30px; font-size:1rem; }
  #prompt { padding:3px 8px; font-size:.85rem; min-height:22px; }
  #work { grid-area: paper; min-width:0; min-height:0; height:auto; }
  [data-theme="journal"] #work { margin:4px 6px 4px 8px; }
  #input {
    grid-area: keys;
    min-width:0; min-height:0;
    border-top: none;
    display: flex; flex-direction: column; justify-content: center;
    --kh: min(44px, 12vh);
    padding: 4px 8px calc(4px + env(safe-area-inset-bottom)) 8px;
  }
  [data-theme="journal"] #input { border-left: 1px solid rgba(0,0,0,.28); }
  #inner {
    max-width: none; width: 100%; margin: 0; flex: 1 1 auto;
    display: grid;
    grid-template-columns: auto 1fr;
    grid-template-areas: "steps pad" "ctx ctx";
    align-items: stretch;
    gap: 6px;
  }
  .steps { grid-area: steps; grid-template-columns: 1fr; grid-template-rows: repeat(5, 1fr); align-self: stretch; gap: 5px; }
  .step { min-height: 0; height: 100%; font-size: 1.35rem; }
  .padwrap { grid-area: pad; display: flex; flex-direction: column; min-height: 0; }
  .pad { flex: 1 1 auto; gap: 5px; }
  .pad .key { min-height: 0; height: 100%; font-size: 1.2rem; }
  .ctx { grid-area: ctx; gap: 5px; }
  .ctxb { font-size: .82rem; min-height: var(--kh, 36px); }
  .cbtn { min-height: max(36px, var(--kh, 36px)); font-size: 1.05rem; }
  /* Larger handwritten digits in this layout (row height is a bit tighter than desktop). */
  .cell { font-size: calc(var(--rh) * .82); }
  [data-theme] body.ep-snow header::after, [data-theme] body.ep-snow #work::after { display:none; }
  [data-theme] body.ep-snow #prompt { padding-top:4px; }
}
@media (orientation: landscape) and (max-height: 520px) and (max-width: 700px) {
  .brand { display:none; }
}

.eq { font-size:1.6rem; font-weight:700; margin:6px 0; color:var(--ink); }
.lvgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); gap:8px; margin:12px 0; text-align:left; }
.lv { min-height:64px; border-radius:14px; border:2px solid var(--key-edge); background:var(--key); padding:8px 10px; text-align:left; }

.confetti { position:fixed; width:10px; height:14px; z-index:70; pointer-events:none; border-radius:2px; }

/* shrinking pie timer */
.pie { position:relative; width:62px; height:62px; border-radius:50%; flex:0 0 auto; display:grid; place-items:center; background:rgba(0,0,0,.28);
  box-shadow:0 0 0 3px #1c120a, 0 0 0 5px #b48a4a; --p:1; --pc:#3d9b45; }
.pie .wedge { position:absolute; inset:0; border-radius:50%; background:conic-gradient(var(--pc) calc(var(--p) * 1turn), transparent 0); transition:background .2s; }
.pie::after { content:''; position:absolute; inset:13px; border-radius:50%; background:#f6ead0; box-shadow:0 0 0 2px rgba(0,0,0,.25); }
.pie .tv { position:relative; z-index:1; font-weight:900; font-size:.86rem; color:#2e2012; font-variant-numeric:tabular-nums; min-width:0 !important; text-align:center !important; letter-spacing:-.02em; }
.pie.timer.warn, .pie.timer.danger { background:rgba(0,0,0,.28); border:none; color:inherit; }
.pie.timer.warn { --pc:#e0a020; }
.pie.timer.danger { --pc:#e0402c; }
.pie.timer.danger .tv { color:#b3200e; }
.pie.timer.paused { opacity:.75; }
/* Phone pie sizes must come after the 62px default so they actually win. */
@media (max-width: 600px) {
  header .pie { width:34px; height:34px; }
  header .pie::after { inset:7px; }
  header .pie .tv { font-size:.58rem; }
}
@media (orientation: landscape) and (max-height: 520px) {
  header .pie { width:30px; height:30px; }
  header .pie::after { inset:6px; }
  header .pie .tv { font-size:.52rem; }
  header { overflow: hidden; }
  .cell { font-size: calc(var(--rh) * .92); padding-bottom: calc(var(--rh) * .04); }
}
/* ================= cinematics ================= */
#cine { position:fixed; inset:0; z-index:100; background:#0b0805; color:#f6e7c4; overflow:hidden; font-family:-apple-system, "Segoe UI", system-ui, sans-serif; touch-action:manipulation; }
#cine[hidden] { display:none; }
.cscreen { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; animation:fadeIn .45s; overflow:hidden; }
.cbg { position:absolute; inset:-60px; background-size:cover; background-position:center; filter:blur(28px) brightness(.42) saturate(1.25); }
.vwrap { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
.cv { width:100%; height:100%; object-fit:contain; display:block; background:transparent; }

@keyframes kb { from { transform:scale(1); } to { transform:scale(1.14) translateY(-1%); } }
/* strength power-up banner (map / header) */
.strboost { position:fixed; left:max(14px, 2vw); right:auto; bottom:max(118px, calc(14vh + env(safe-area-inset-bottom))); top:auto; transform:none; z-index:120; width:min(340px, 42vw); pointer-events:none; overflow:visible;
  display:flex; flex-direction:column; align-items:center; gap:8px; padding:28px 18px 14px; border-radius:18px;
  background:linear-gradient(180deg, rgba(18,10,4,.94), rgba(40,22,8,.9)); border:2px solid #f3c65a; box-shadow:0 12px 40px rgba(0,0,0,.55), 0 0 28px rgba(243,198,90,.35);
  animation:strIn .45s cubic-bezier(.2,1.4,.4,1) both; }
.strboost.go { animation:strOut .5s ease-in forwards; }
@keyframes strIn { from { opacity:0; transform:translateY(18px) scale(.92); } to { opacity:1; transform:translateY(0) scale(1); } }
@keyframes strOut { to { opacity:0; transform:translateY(14px) scale(.96); } }
.strboost .sblbl { font-weight:900; letter-spacing:.06em; color:#fff3d0; font-size:0.95rem; text-transform:uppercase; }
.strboost .sbbar { position:relative; width:100%; height:28px; border-radius:999px; background:rgba(255,255,255,.12); overflow:visible; box-shadow:inset 0 2px 6px rgba(0,0,0,.45); margin-top:10px; }
.strboost .sbbar .sbfill { height:100%; width:0%; border-radius:999px; background:linear-gradient(90deg, #2f9a5a, #f3c65a 70%, #ffe9a0);
  box-shadow:0 0 16px rgba(243,198,90,.75), 0 0 8px rgba(47,154,90,.6); transition:none; overflow:hidden; }
.strboost .sbbar.pulse .sbfill { animation:sbPulse 1.1s ease-in-out infinite; }
@keyframes sbPulse { 0%,100% { filter:brightness(1); } 50% { filter:brightness(1.25); } }
.strboost .sbpct { font-weight:900; font-size:1.55rem; color:#fff; font-variant-numeric:tabular-nums; text-shadow:0 2px 8px rgba(0,0,0,.6); }
.strboost .sbbadge { position:absolute; right:8px; top:-22px; padding:6px 12px; border-radius:999px; font-weight:900; font-size:1.05rem;
  background:linear-gradient(180deg,#ffe9a0,#f3c65a); color:#3a2208; box-shadow:0 6px 16px rgba(0,0,0,.4); animation:badgePop .55s cubic-bezier(.2,1.6,.4,1) both; z-index:2; }
@keyframes badgePop { 0% { opacity:0; transform:translateY(10px) scale(.4); } 60% { transform:translateY(-6px) scale(1.12); } 100% { opacity:1; transform:translateY(0) scale(1); } }
.strboost .sbbadge.float { animation:badgeFloat 2.2s ease-out forwards; }
@keyframes badgeFloat { to { transform:translateY(-36px); opacity:0; } }
/* When the map is up, keep the boost clear of the title banner and the bottom-right Continue stack */
.cscreen.map ~ * .strboost, body:has(#cine:not([hidden]) .cscreen.map) .strboost {
  left:max(18px, 2.2vw); right:auto; bottom:max(150px, calc(18vh + env(safe-area-inset-bottom)));
  width:min(320px, 38vw); transform:none; overflow:visible;
}
@media (max-aspect-ratio: 3/4) {
  .cscreen.map ~ * .strboost, body:has(#cine:not([hidden]) .cscreen.map) .strboost {
    left:50%; transform:translateX(-50%); width:min(340px, 86vw); bottom:max(160px, calc(20vh + env(safe-area-inset-bottom)));
  }
}

.vload, .vtap { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:2; pointer-events:none; }

.sbr.me td { box-shadow:inset 0 3px 0 #f3c65a, inset 0 -3px 0 #f3c65a; }
.sbr.me td:first-child { box-shadow:inset 3px 3px 0 #f3c65a, inset 0 -3px 0 #f3c65a; } .sbr.me td:last-child { box-shadow:inset -3px 3px 0 #f3c65a, inset 0 -3px 0 #f3c65a; }
.sbempty { text-align:center; font-weight:800; font-size:1.2rem; padding:40px 10px; color:#e3cfa3; }
.sbfoot { display:flex; justify-content:center; align-items:center; gap:14px; }
.sbgo { min-height:56px; min-width:200px; padding:0 28px; border-radius:16px; border:2px solid #f3c65a; background:linear-gradient(#4f8a3c,#2f6b2a); color:#fff; font:900 1.25rem "Cinzel MVM", Georgia, serif; letter-spacing:.04em; box-shadow:0 5px 0 #173016, 0 12px 26px rgba(0,0,0,.55); }
.sbhint { font-size:.8rem; color:#cdb88f; font-weight:700; }
.sb { --bw:62px; --bh:44px; --sw:17px; --nw:190px; }
@media (max-width: 1100px) { .sb { --bw:52px; --bh:42px; --sw:14.5px; --nw:150px; } .sbt th.sblv small { font-size:.58rem; } }
@media (max-width: 700px) { .sb { --bw:54px; --bh:40px; --sw:15px; --nw:118px; } .nbx { font-size:.92rem; padding:0 7px; line-height:1.1; } .nbx .nm { white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow-wrap:anywhere; } .sbt td.sbrk, .sbt th.sbrk { width:30px; min-width:30px; font-size:1rem; } .sbt th.sbnm, .sbt td.sbnm { left:30px; } .sbtot .tbx { min-width:52px; font-size:1.1rem; } .sbhint { display:none; } }
@media (max-height: 460px) { .sb { --bh:34px; --sw:14px; } .sbwrap { gap:4px; padding-top:calc(6px + env(safe-area-inset-top)); } .sbtitle { font-size:1.3rem; } .sbsub { display:none; } .sbgo { min-height:44px; font-size:1.05rem; } .sbt th.sblv small { display:none; } .sbcue { padding:3px 14px; font-size:.9rem; } }
/* win freeze frame */
.cscreen.vid.frozen .ccap { bottom:calc(92px + env(safe-area-inset-bottom)); }
.vcont { position:absolute; z-index:4; left:0; right:0; margin:0 auto; width:max-content; bottom:calc(20px + env(safe-area-inset-bottom)); min-height:50px; padding:0 26px; border-radius:999px; border:2px solid #f3c65a; background:linear-gradient(#70482a, #3e2612); color:#fff3d0; font:900 1.1rem "Cinzel MVM", Georgia, serif; letter-spacing:.05em; box-shadow:0 5px 0 #1f1208, 0 10px 24px rgba(0,0,0,.6); animation:fadeUp .5s both; }
/* login teaser + password dialog */
.lbtz { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
.lbtz div { display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:12px; font-weight:800; }
.lbtz div:nth-child(odd) { background:#2f5b2b; } .lbtz div:nth-child(even) { background:#5b3b1f; }
.lbtz b { color:#f3c65a; font-family:"Cinzel MVM", Georgia, serif; width:1.4em; } .lbtz span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .lbtz i { font-style:normal; color:#f6c64a; }
.lbopen { width:100%; }
.pwrow { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
.pwrow .mdin { flex:1; }
.pwshow { min-height:44px; padding:0 12px; border-radius:12px; border:2px solid rgba(243,198,90,.6); background:rgba(255,255,255,.07); color:#fff3d0; font-weight:800; font-size:.9rem; }
.pwlab { display:block; font-weight:800; color:#e3cfa3; margin:2px 0 6px; font-size:.95rem; }
.pwhelp { font-size:.85rem; color:#cdb88f; font-weight:600; margin-top:4px; }
/* modal */
.mdl { position:fixed; inset:0; z-index:400; background:rgba(10,6,2,.66); display:flex; align-items:center; justify-content:center; padding:20px; animation:fadeIn .2s; }
.mdcard { width:min(540px, 100%); max-height:88vh; overflow:auto; background:linear-gradient(#3a2615, #24170c); color:#f6e7c4; border:2px solid #f3c65a; border-radius:20px; padding:20px 22px; box-shadow:0 20px 60px rgba(0,0,0,.6); text-align:left; animation:cardIn .3s cubic-bezier(.2,1.3,.4,1); }
.mdcard.wide { width:min(860px, 100%); }
.mdcard h2 { margin:0 0 8px; font-family:"Cinzel MVM", Georgia, serif; font-weight:900; color:#f3c65a; font-size:1.4rem; }
.mdcard p { margin:0 0 12px; color:#e9d6ad; font-weight:600; line-height:1.4; }
.mderr { min-height:1.3em; color:#ff9c8a; font-weight:700; margin:8px 0; }
.mdbtns { display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:6px; }
.mdbtns button, .tbtn { min-height:52px; padding:0 20px; border-radius:14px; border:2px solid #f3c65a; background:linear-gradient(#4f8a3c, #2f6b2a); color:#fff; font-weight:800; font-size:1.02rem; }
.mdbtns .mdsec, .tbtn.sec { background:transparent; color:#f6e7c4; border-color:rgba(243,198,90,.5); }
.mdbtns .danger, .tbtn.danger { background:linear-gradient(#c23b2a, #8e2216); border-color:#ffb3a6; }
/* teacher */
.cscreen.teacher { background:radial-gradient(ellipse at 50% 20%, #3a2615, #120b05); align-items:stretch; }
.tchwrap { position:absolute; top:0; bottom:0; left:0; right:0; overflow:auto; padding:calc(20px + env(safe-area-inset-top)) 20px 40px; max-width:1200px; margin:0 auto; color:#f6e7c4; }
.tchhead { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.tchhead h1 { font-family:"Cinzel MVM", Georgia, serif; font-weight:900; color:#f3c65a; margin:0; font-size:2rem; }
.tchsub { color:#cdb88f; font-weight:700; } .tchhead .tbtn { margin-left:auto; }
.tchauth { margin-top:10px; font-weight:700; color:#cdb88f; }
.tchact { display:flex; gap:10px; flex-wrap:wrap; margin:16px 0; }
.tchjump { margin:0 0 16px; padding:14px 16px; border:1px solid rgba(243,198,90,.35); border-radius:16px; background:rgba(0,0,0,.28); }
.tchjump-lbl { font-family:"Cinzel MVM", Georgia, serif; font-weight:900; color:#f3c65a; font-size:1.15rem; margin:0 0 4px; }
.tchjump-hint { color:#cdb88f; font-weight:600; font-size:.9rem; margin:0 0 10px; }
.tchjump .seg { margin:0 0 8px; }
.tchjump .seg button { flex:1; min-height:48px; border-radius:12px; border:2px solid rgba(243,198,90,.5); background:rgba(255,255,255,.06); color:#f6e7c4; font-weight:800; }
.tchjump .seg button.sel { border-color:#f3c65a; background:rgba(243,198,90,.18); color:#fff3d0; }
.tchjump .tbtn { margin-top:4px; }
.tchtable { background:rgba(0,0,0,.3); border:1px solid rgba(243,198,90,.35); border-radius:16px; overflow:auto; }
.tchtable table { width:100%; border-collapse:collapse; min-width:740px; font-variant-numeric:tabular-nums; }
.tchtable th { position:sticky; top:0; background:#2a1a0d; text-align:left; padding:10px 12px; font-size:.78rem; text-transform:uppercase; letter-spacing:.05em; color:#cdb88f; }
.tchtable td { padding:10px 12px; border-top:1px solid rgba(255,255,255,.08); font-weight:600; }
.tchtable td.empty { text-align:center; padding:28px; opacity:.8; }
.tchrow { white-space:nowrap; text-align:right; }
.tchrow button { min-height:44px; padding:0 14px; margin-left:6px; border-radius:10px; border:1px solid rgba(243,198,90,.5); background:rgba(255,255,255,.06); color:#f6e7c4; font-weight:800; }
.tchrow button.danger { border-color:#ff9c8a; color:#ffb3a6; }
/* alerts */
#atoasts { position:fixed; top:calc(12px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); z-index:450; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; width:min(92vw, 560px); }
.atoast { background:rgba(24,15,7,.94); color:#fff3d0; border:2px solid #f3c65a; border-radius:16px; padding:12px 18px; font-weight:800; font-size:1.05rem; box-shadow:0 10px 30px rgba(0,0,0,.5); animation:atIn .45s cubic-bezier(.2,1.5,.4,1); text-align:center; transition:opacity .35s, transform .35s; }
.atoast::before { content:"🏅 "; }
.atoast.out { opacity:0; transform:translateY(-10px); }
@keyframes atIn { from { opacity:0; transform:translateY(-20px) scale(.9); } to { opacity:1; transform:none; } }
/* map: leaderboard button + continue / save for later */
.mlb { position:absolute; left:2.2%; right:auto; bottom:2.4%; z-index:4; min-width:56px; height:56px; padding:0 14px; border-radius:999px; border:2px solid #f3c65a; background:rgba(20,12,4,.78); color:#fff3d0; font-size:1.4rem; box-shadow:0 6px 16px rgba(0,0,0,.5); }
/* mchoice rules live with map styles */

.mcbtn { flex:1; max-width:300px; min-height:74px; border-radius:18px; font-family:"Cinzel MVM", Georgia, serif; font-weight:900; font-size:clamp(1.05rem, 2.3vh, 1.4rem); letter-spacing:.03em; border:2px solid #f3c65a; background:linear-gradient(#4f8a3c, #2f6b2a); color:#fff; box-shadow:0 6px 0 #1f1208, 0 12px 28px rgba(0,0,0,.6); }
.mcbtn.sec { background:linear-gradient(#70482a, #3e2612); color:#fff3d0; }
.mcbtn:active { transform:translateY(4px); box-shadow:0 2px 0 #1f1208; }
/* laptops / wide screens: keep the workspace a sensible width */
@media (min-width: 1500px) { #app { max-width:1500px; margin:0 auto; } }
@media (min-width: 1100px) and (orientation: landscape) { #inner { max-width:1060px; } }
